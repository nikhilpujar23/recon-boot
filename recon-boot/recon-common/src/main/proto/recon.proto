syntax = "proto3";
package recon.v1;

option java_package         = "com.recon.v1";
option java_multiple_files  = true;
option java_outer_classname = "ReconProto";

// Emitted by SftpWatcher when a new settlement file is detected (Phase 2).
message FileArrived {
  string file_id     = 1;
  string filename    = 2;
  string sha256      = 3;
  int64  bytes       = 4;
  int64  detected_at = 5;  // unix epoch ms
}

// One message per settlement line; drives the rules + agent workers (Phase 2).
message ReconRequest {
  string file_id  = 1;
  int32  line_no  = 2;
  string case_uid = 3;  // hex of UUID-5(file_id:line_no)
}

// Emitted by rules-worker when a case is routed to the LLM agent.
// Persisted in outbox (topic = 'recon.investigate', schema_id = 3)
// so agent-worker can poll it across the JVM boundary.
message ReconInvestigate {
  string case_uid = 1;
}

// Written back to Kafka after rules/agent resolution (Phase 2).
message ReconResult {
  string case_uid       = 1;
  string match_type     = 2;
  string resolution     = 3;
  double confidence     = 4;
  string resolved_by    = 5;
  int64  resolved_at_ms = 6;
}
