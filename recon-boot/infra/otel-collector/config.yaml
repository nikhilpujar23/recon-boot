# OpenTelemetry Collector — recon-agent
# Receives OTLP traces/metrics from all recon workers and forwards them to Tempo + Prometheus.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Drop spans that contain PII patterns (belt-and-suspenders; LLD §13.2)
  filter/no_pii:
    error_mode: ignore
    traces:
      span:
        # Drop any span whose attribute value looks like a VPA, phone, or PAN
        - 'attributes["payer_vpa"] != nil'
        - 'attributes["payee_vpa"] != nil'
        - 'attributes["pan"] != nil'

  resource:
    attributes:
      - key: service.environment
        value: ${env:ENVIRONMENT:-development}
        action: upsert

exporters:
  # Traces → Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics → Prometheus (scraped by prometheus service)
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: recon

  # Debug logging (disable in prod by removing this exporter from pipelines)
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus]

  telemetry:
    logs:
      level: warn
