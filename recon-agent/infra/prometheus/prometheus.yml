# Prometheus scrape config — recon-agent
# LLD §13.1: all Prometheus metrics are scraped from /metrics on each service.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: recon-agent

scrape_configs:

  # ── OTel Collector (forwards app metrics from all workers) ─────────────────
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # ── Postgres exporter (optional — enable if postgres-exporter is added) ─────
  # - job_name: postgres
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # ── Kafka exporter (optional — enable if kafka-exporter is added) ────────────
  # - job_name: kafka
  #   static_configs:
  #     - targets: ["kafka-exporter:9308"]

  # ── Direct scrape of recon workers (if they expose /metrics on :9100) ──────
  # Workers expose Prometheus metrics via obs/metrics.py on port 9100.
  # Uncomment once Phase 6 observability module is implemented.
  #
  # - job_name: recon-workers
  #   static_configs:
  #     - targets:
  #         - "outbox-drainer:9100"
  #         - "ingest-worker:9100"
  #         - "rules-worker:9100"
  #   metrics_path: /metrics

  # ── Prometheus self-monitoring ───────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
