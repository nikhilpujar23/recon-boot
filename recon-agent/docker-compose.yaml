# Autonomous Payment Reconciliation Agent — Docker Compose
# LLD §15: OCI A1.Flex 4 OCPU / 24 GB ARM64 (also runs on x86_64 / Apple Silicon)
#
# Services:
#   Infrastructure : postgres, kafka (KRaft), sftp
#   App workers    : outbox-drainer, ingest-worker, rules-worker
#   API            : api (Phase 5 — starts as soon as src/recon/api/main.py exists)
#   Reverse proxy  : caddy
#   Observability  : otel-collector, prometheus, grafana, tempo
#
# Quick start:
#   cp .env.example .env          # fill in ANTHROPIC_API_KEY and PII keys
#   docker compose up -d          # start everything
#   docker compose exec postgres psql -U recon recon  # connect to DB
#   docker compose logs -f ingest-worker rules-worker  # tail pipeline logs
#
# Drop a file into ./data/sftp/ and watch it flow through the pipeline.

x-recon-common: &recon-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql://recon:recon@postgres:5432/recon
    KAFKA_BROKERS: kafka:9092
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - recon

services:

  # ── Postgres ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: recon
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_phase2.sql:/docker-entrypoint-initdb.d/002_phase2.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d recon"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"          # expose for local psql / GUI tools
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - recon

  # ── Kafka (KRaft — no Zookeeper) ────────────────────────────────────────────
  # Uses the official Apache Kafka Docker image (introduced in Kafka 3.7.0).
  # Multi-arch: linux/amd64 + linux/arm64 (Apple Silicon / OCI A1).
  kafka:
    image: apache/kafka:3.7.0
    environment:
      # KRaft mode — combined broker + controller in a single node
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single-node tuning
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_LOG_RETENTION_HOURS: "168"          # 7 days
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Stable cluster ID for KRaft (base64-encoded UUID — change in production)
      CLUSTER_ID: "ciTHZBF3Ry2h8xYqPFXxVA"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 && /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    ports:
      - "9092:9092"          # expose for local kafka-cli / kcat
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - recon

  # ── Kafka topic init (runs once, exits) ─────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        echo 'Creating Kafka topics...' &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic files.new --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic recon.requests --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic recon.results --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic recon.investigate --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic recon.dlq --partitions 1 --replication-factor 1 &&
        echo 'All topics created.'
    networks:
      - recon
    restart: "no"

  # ── SFTP server (settlement file drop zone) ─────────────────────────────────
  # linuxserver/openssh-server: multi-arch (amd64 + arm64), listens on 2222
  sftp:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      USER_NAME: "recon"
      USER_PASSWORD: "recon"
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
      LOG_STDOUT: "true"
    volumes:
      - sftp_data:/config/home/recon/upload
    ports:
      - "2222:2222"          # sftp -P 2222 recon@localhost
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - recon

  # ── Outbox drainer ───────────────────────────────────────────────────────────
  outbox-drainer:
    <<: *recon-common
    command: ["workers", "outbox"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Ingest worker (files.new → parser → settlement_lines) ───────────────────
  ingest-worker:
    <<: *recon-common
    command: ["workers", "ingest", "--watch-dir", "/data/sftp"]
    volumes:
      - sftp_data:/data/sftp:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Rules worker (recon.requests → rules engine → recon_cases) ──────────────
  rules-worker:
    <<: *recon-common
    command: ["workers", "rules"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M

  # ── SFTP watcher (watches /data/sftp, emits FileArrived) ────────────────────
  sftp-watcher:
    <<: *recon-common
    command: ["workers", "watcher", "--watch-dir", "/data/sftp"]
    volumes:
      - sftp_data:/data/sftp:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Agent worker (recon.investigate → LLM investigation → recon_cases) ────────
  agent-worker:
    <<: *recon-common
    command: ["workers", "agent"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M

  # ── API (Phase 5 — uncomment once src/recon/api/main.py is implemented) ─────
  # api:
  #   <<: *recon-common
  #   command: ["uvicorn", "recon.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
  #   ports:
  #     - "8000:8000"
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M

  # ── Caddy (reverse proxy + TLS termination) ──────────────────────────────────
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - recon
    # Caddy starts even if API isn't up yet; it will 502 until API is ready

  # ── OTel Collector ───────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"          # OTLP gRPC
      - "4318:4318"          # OTLP HTTP
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - recon

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - recon

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - recon

  # ── Tempo (distributed tracing backend) ─────────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.2
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./infra/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"          # Tempo HTTP API (used by Grafana datasource)
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - recon

volumes:
  postgres_data:
  kafka_data:
  sftp_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  recon:
    driver: bridge
