[project]
name = "recon-agent"
version = "0.2.0"
description = "Autonomous Payment Reconciliation Agent"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
kafka = [
    "aiokafka>=0.10",
    "watchdog>=4.0",
]
agent = [
    "anthropic>=0.28",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]
pii = [
    "spacy>=3.7",
]
all = [
    "aiokafka>=0.10",
    "watchdog>=4.0",
    "anthropic>=0.28",
    "spacy>=3.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
recon = "recon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["eval: golden-case eval harness (deselect with -m 'not eval')"]
